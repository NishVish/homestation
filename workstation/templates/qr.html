<form id="form">
    <input type="file" name="image" accept="image/*" capture>
    <button type="submit">Scan</button>
</form>

<p id="result"></p>

<hr>

<h3>📌 Last QR (server)</h3>
<p id="last"></p>

<h3>📊 All QR Logs</h3>
<ul id="logs"></ul>

<script>

    async function loadLogs() {

        // last QR
        const lastRes = await fetch("last/");
        const lastData = await lastRes.json();

        document.getElementById("last").innerText =
            lastData.qr_data
                ? `${lastData.timestamp} → ${lastData.qr_data}`
                : "No data";

        // all logs
        const allRes = await fetch("all/");
        const allData = await allRes.json();

        const list = document.getElementById("logs");
        list.innerHTML = "";

        if (allData.logs) {
            allData.logs.reverse().forEach(item => {
                const li = document.createElement("li");
                li.innerText = `${item.timestamp} → ${item.qr_data}`;
                list.appendChild(li);
            });
        }
    }


    // scan upload
    document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(e.target);

        const res = await fetch("upload/", {
            method: "POST",
            body: formData
        });

        const data = await res.json();

        document.getElementById("result").innerText =
            data.result ? "QR: " + data.result : "No QR found";

        // refresh logs after scan
        loadLogs();
    });


    // initial load
    loadLogs();

</script>
