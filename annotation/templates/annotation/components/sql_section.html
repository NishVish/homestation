
<textarea id="sqlQuery" rows="5">SELECT decision, COUNT(*) AS count
FROM labeled_flatdata
WHERE edited = '1'
GROUP BY decision;</textarea>

<button onclick="executeSQL()">Execute SQL</button>

<div id="sqlResponse" style="overflow-x:auto; margin-top:20px;"></div>

<script>
function getCookie(name) {
    let cookieValue = null;

    if (document.cookie) {
        const cookies = document.cookie.split(";");

        for (let cookie of document.cookie.split(";")) {
            cookie = cookie.trim();

            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(
                    cookie.substring(name.length + 1)
                );
                break;
            }
        }
    }

    return cookieValue;
}

const csrfToken = getCookie("csrftoken");


async function executeSQL() {
    const query = document.getElementById("sqlQuery").value;
    const responseBox = document.getElementById("sqlResponse");

    responseBox.innerHTML = "Loading...";

    try {
        const response = await fetch("/annotation/execute-sql/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrfToken
            },
            body: JSON.stringify({
                query: query,
                params: []
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            responseBox.textContent = data.message || "SQL execution failed.";
            return;
        }

        const rows = data.data;

        if (!Array.isArray(rows) || rows.length === 0) {
            responseBox.textContent = "No records found.";
            return;
        }

        // Generate table headers dynamically
        const columns = Object.keys(rows[0]);

        let html = `
            <table style="
                width:100%;
                border-collapse:collapse;
                margin-top:10px;
                font-size:14px;
            ">
                <thead>
                    <tr>
        `;

        columns.forEach(column => {
            html += `
                <th style="
                    padding:10px;
                    border:1px solid #ccc;
                    background:#333;
                    color:white;
                    text-align:left;
                ">${escapeHTML(column)}</th>
            `;
        });

        html += `</tr></thead><tbody>`;

        // Generate table rows
        rows.forEach(row => {
            html += "<tr>";

            columns.forEach(column => {
                html += `
                    <td style="
                        padding:10px;
                        border:1px solid #ccc;
                    ">${escapeHTML(row[column] ?? "")}</td>
                `;
            });

            html += "</tr>";
        });

        html += `
                </tbody>
            </table>
            <p>Total rows: ${rows.length}</p>
        `;

        responseBox.innerHTML = html;

    } catch (error) {
        responseBox.textContent = error.message;
    }
}


// Prevent SQL results from being interpreted as HTML
function escapeHTML(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>
