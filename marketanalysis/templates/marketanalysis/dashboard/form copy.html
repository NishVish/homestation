<script>
    let currentId = 100;

    function loadData(id) {
        fetch(`databyid/${id}/`)
            .then(res => res.json())
            .then(res => {
                const data = res.data?.[2]; // first record

                if (!data) return;

                Object.keys(data).forEach(key => {
                    const el = document.querySelector(`[name="${key}"]`);
                    if (el) el.value = data[key];
                });
            });
    }


    loadData(currentId);
</script>
